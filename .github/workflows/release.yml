name: Release

on:
  workflow_dispatch:
    inputs:
      version-bump-type:
        description: Version bump type
        required: false
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch
      dry-run:
        description: Preview changes without publishing
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

# Least privilege by default; the two jobs that need more grant it themselves.
permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: bump version
        id: version
        run: |
          ./scripts/versioning/version-bump.sh \
            ${{ inputs.version-bump-type }}

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            outfile: gtools-linux-x64
          - target: bun-linux-arm64
            outfile: gtools-linux-arm64
          - target: bun-windows-x64
            outfile: gtools-windows-x64.exe
          - target: bun-darwin-x64
            outfile: gtools-macos-x64
          - target: bun-darwin-arm64
            outfile: gtools-macos-arm64
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: install deps
        run: pnpm i --frozen-lockfile

      - name: update package version
        run: |
          ./scripts/versioning/set-package-version.sh \
            ${{ needs.version.outputs.version }}

      - name: compile binary
        run: |
          ./scripts/build/binary.sh \
            ${{ matrix.target }} \
            ${{ matrix.outfile }}

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.outfile }}
          path: ${{ matrix.outfile }}
          retention-days: 1

  publish:
    needs: version
    runs-on: ubuntu-latest
    # id-token: write enables npm trusted publishing (OIDC) — no npm token
    # needed. The package must have this repo + workflow filename configured as
    # a trusted publisher on npmjs.com (package Settings -> Trusted Publisher).
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: update npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: install deps
        run: pnpm i --frozen-lockfile

      - name: verify formatting
        run: pnpm format:check

      - name: typecheck
        run: pnpm typecheck

      - name: update package version
        run: |
          ./scripts/versioning/set-package-version.sh \
            ${{ needs.version.outputs.version }}

      - name: build
        run: pnpm build

      # husky is a dev-only hook installer; shipping it as a lifecycle script
      # makes npm warn consumers about install scripts on every install.
      - name: strip dev-only prepare script
        run: npm pkg delete scripts.prepare

      - name: publish to npm
        run: npm publish ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          NPM_CONFIG_PROVENANCE: 'true'

  release:
    needs: [version, build, publish]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    # contents: write creates the release and its tag; actions: write is
    # required to delete the intermediate build artifacts afterwards.
    permissions:
      contents: write
      actions: write
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: publish binaries to github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: gtools v${{ needs.version.outputs.version }}
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: delete temporary actions artifacts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            --paginate \
            --jq '.artifacts[].id' |
          while read artifact_id; do
            echo "Deleting artifact $artifact_id"
            gh api \
              --method DELETE \
              repos/${{ github.repository }}/actions/artifacts/$artifact_id
          done
